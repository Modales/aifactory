# Base44 dev environment for FormFit AI.
# Runs the Vite frontend and the FastAPI backend from cloned source with live reload.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aifactory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aifactory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local infra credentials — generated, not user-supplied.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/aifactory
      JWT_SECRET: base44-dev-only-jwt-secret-please-change
      ACCESS_TOKEN_TTL_MINUTES: "10080"
      AIML_BASE_URL: https://api.aimlapi.com/v1
      COACH_MODEL: anthropic/claude-sonnet-4.6
    env_file:
      - /run/base44/app.env
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: node:22
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"

volumes:
  db_data:
  node_modules:
